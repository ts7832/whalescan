name: insider-sweep
# WHALESCAN's primary loop. GitHub drops many scheduled runs of small repos, so instead of relying on a
# 15-minute cron, each job keeps sweeping every 15 minutes for ~5 hours. An hourly trigger only has to get
# through once every few hours; a trigger that arrives while a job runs waits in the queue and takes over.
# Each sweep publishes its alerts to the `data` branch, which the dashboard reads directly.
on:
  schedule:
    - cron: "7 * * * *"   # off-peak minute; hourly is plenty because every job runs for hours
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: insider-sweep
  cancel-in-progress: false
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - name: Restore sweep window
        uses: actions/cache/restore@v4
        with:
          path: data/sweep.duckdb
          key: sweep-${{ github.run_id }}
          restore-keys: sweep-
      - name: Sweep every 15 minutes for ~5 hours
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv sync --locked
          stop=$((SECONDS + 320 * 60))
          while :; do
            began=$SECONDS
            if uv run whalescan sweep; then
              scripts/publish-data.sh || echo "::warning::publishing alerts failed; next round in 15 min"
            else
              echo "::warning::sweep round failed; next round in 15 min"
            fi
            [ $((SECONDS + 900)) -lt "$stop" ] || break
            wait=$((900 - (SECONDS - began)))
            [ "$wait" -gt 0 ] && sleep "$wait"
          done
      - name: Save sweep window
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/sweep.duckdb
          key: sweep-${{ github.run_id }}
