name: api-smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/smoke.py", ".github/workflows/smoke.yml"]
jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: python scripts/smoke.py
