# Every threshold WHALESCAN uses. Paths are relative to the repo root unless absolute.

[paths]
research_db = "data/research.duckdb"
scores_parquet = "data/scores.parquet"
snapshot_dir = "data/snapshot"
ledger_dir = "data/ledger"

[http]
rate_per_s = 5.0
max_retries = 5
concurrency = 16
user_agent = "whalescan/0.1 (+https://github.com/whalescan)"

# Measured 2026-09-24: Data API returns 429 above ~12 req/s sustained; Gamma served 20 req/s cleanly.
[http.host_rates]
"data-api.polymarket.com" = 10.0
"gamma-api.polymarket.com" = 20.0
"clob.polymarket.com" = 10.0

[universe]
max_wallets = 3000
leaderboard_periods = ["ALL", "MONTH"]
leaderboard_orders = ["PNL", "VOL"]
leaderboard_pages = 10
large_trade_min_usdc = 5000
large_trade_lookback_days = 30
max_wallet_age_days = 14

[scoring]
n_sims = 100000
n_sims_screen = 2000
screen_p = 0.2
seed = 20260924
min_n_eff = 20
bh_q = 0.10
min_post_edge = 0.03
price_min = 0.03
price_max = 0.97
winsor_quantile = 0.95
farmer_price = 0.95
farmer_share = 0.60
lottery_price = 0.05
lottery_share = 0.60
mm_both_sides_share = 0.30

[gate]
# "sniper": the only historical-edge signal is a rare, huge-winning, big-bet wallet ([sniper]).
# "certified": any wallet certified by the FDR-controlled skill test (the original mode).
skill_mode = "sniper"
aggregation_window_s = 600
min_usdc = 5000
conviction_k = 2.0
price_min = 0.05
price_max = 0.95
min_hours_to_end = 2.0
follow_size_usdc = 1000
min_net_edge = 0.02
max_entry_margin = 0.01
tier_a_net_edge = 0.05
tier_a_consensus = 2
conflict_window_h = 24
fallback_max_cat_positions = 10
signal_lookback_h = 24
max_contacts = 300

[sniper]
# Old accounts that trade rarely, win at an extreme rate and bet big. Still significance-tested, so a wallet
# that only buys heavy favourites (easy 90% win rate, no edge) is not a sniper.
min_positions = 8
max_positions = 50
min_win_rate = 0.80
min_median_stake = 5000
max_p_value = 0.01

[sweep]
# The 15-minute insider sweep reads every fill of at least this size across Polymarket and adds fills up
# per wallet, so an insider splitting $20k into small pieces is still caught (~950 such fills per hour).
fill_min_usdc = 1000

[insider]
# Fresh-wallet insider pattern: no history needed (see Plan 2 addendum for the evidence).
max_age_days = 7
tier_a_age_days = 2
max_markets = 10
min_usdc = 10000
tier_a_usdc = 25000
price_min = 0.02
price_max = 0.90
max_slippage = 0.05
# OTHER is excluded on purpose: untagged or unknown markets are often sports the tag list misses.
categories = ["POLITICS", "GEOPOLITICS", "ECONOMY", "TECH", "CULTURE"]
profile_ttl_h = 24
unknown_profile_ttl_h = 6

[validation]
fold_days = 14
min_history_days = 60
slippage = 0.015
n_sims = 20000
max_wallets = 300
every_hours = 24
min_signals = 30
min_wallets = 10

[ledger]
# Track Record: log every call, price it realistically, follow it to settlement (see the Track Record spec).
entry_size_usdc = 1000
checkpoint_days = [7, 14, 21, 28]
monthly_step_days = 30
quarterly_step_days = 91
quarterly_after_years = 3
near_miss_age_max_days = 30
near_miss_markets_max = 30
near_miss_usdc_min = 5000
min_scored = 30
settlement_grace_days = 7  # a closed market with no clean winner may still be mid-UMA-resolution

[blocklist]
slug_patterns = ["updown", "up-or-down", "-(5|15)m-"]
min_market_volume = 10000

[categories]
order = ["CRYPTO", "POLITICS", "GEOPOLITICS", "ECONOMY", "TECH", "SPORTS", "CULTURE"]

[categories.tags]
CRYPTO = ["crypto", "bitcoin", "ethereum", "solana", "crypto prices"]
POLITICS = ["politics", "elections", "us politics", "global elections", "trump"]
GEOPOLITICS = ["geopolitics", "world", "middle east", "ukraine", "israel", "china"]
ECONOMY = ["economy", "fed", "finance", "business", "stocks", "economic policy"]
TECH = ["tech", "ai", "science", "big tech"]
SPORTS = ["sports", "esports", "nfl", "nba", "mlb", "nhl", "soccer", "games", "tennis", "ufc"]
CULTURE = ["culture", "pop culture", "movies", "music", "awards", "mentions", "tweets", "celebrities"]
